stacks:
  wishlist:
    stock:
      db: { use: postgres-16, env: { POSTGRES_PASSWORD: preview, POSTGRES_DB: saleor } }
    services:
      api:
        repo: massanulaga/saleor
        port: 8000
        health: /health/
        env:
          DATABASE_URL: postgres://postgres:preview@${db.host}:5432/saleor
          SECRET_KEY: preview-only-not-for-production
          ALLOWED_HOSTS: "*"
          ALLOWED_CLIENT_HOSTS: "*"
        setup:
          - python manage.py migrate
          - python manage.py populatedb --createsuperuser
        writable:
          - /app/media
      storefront:
        repo: massanulaga/storefront
        port: 3000
        health: /
        writable:
          - /app/.next/server/route-cache
          - /app/.next/cache
        build-args: { NEXT_PUBLIC_SALEOR_API_URL: "${api.public}/graphql/", NEXT_PUBLIC_DEFAULT_CHANNEL: default-channel }
      dashboard:
        repo: massanulaga/saleor-dashboard
        port: 80
        health: /dashboard/
        writable:
          - /var/cache/nginx
        build-args: { API_URL: "${api.public}/graphql/", FF_USE_STAGING_SCHEMA: "true" }
        sign-in:
          - { user: admin@example.com, password: admin }
